# VisitFlow - hazır imajla çalıştırma (kaynak kod gerekmez).
#   cp .env.example .env      # parolaları doldurun
#   docker compose up -d
#   docker compose logs app | grep -A1 "KURULUM KODU"
# Ardından https://localhost/Setup (veya https://$VISITFLOW_DOMAIN/Setup) adresini açın.
name: visitflow

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: visitflow
      POSTGRES_USER: visitflow_owner
      POSTGRES_PASSWORD: ${POSTGRES_OWNER_PASSWORD:?set POSTGRES_OWNER_PASSWORD in .env}
      VISITFLOW_APP_USER: visitflow_app
      VISITFLOW_APP_PASSWORD: ${POSTGRES_APP_PASSWORD:?set POSTGRES_APP_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/postgresql/data
      - ./deploy/postgres/01-roles.sh:/docker-entrypoint-initdb.d/01-roles.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visitflow_owner -d visitflow"]
      interval: 5s
      retries: 10
    networks: [backend]

  app:
    image: ${VISITFLOW_IMAGE:-ghcr.io/alperenncetinn/visitflow}:${VISITFLOW_VERSION:-latest}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # The app runs as a non-root user and needs no Linux capabilities; only App_Data and /tmp are writable.
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    environment:
      ConnectionStrings__VisitFlow: "Host=db;Database=visitflow;Username=visitflow_app;Password=${POSTGRES_APP_PASSWORD}"
      ConnectionStrings__VisitFlowMigrator: "Host=db;Database=visitflow;Username=visitflow_owner;Password=${POSTGRES_OWNER_PASSWORD}"
      App__BaseUrl: https://${VISITFLOW_DOMAIN:-localhost}
      ReverseProxy__KnownNetworks__0: 172.28.0.0/16
      Mail__Transport: ${MAIL_TRANSPORT:-Smtp}
      Mail__SmtpHost: ${SMTP_HOST:-mailpit}
      Mail__SmtpPort: ${SMTP_PORT:-1025}
      Mail__SmtpSecurity: ${SMTP_SECURITY:-None}
      Mail__SmtpUser: ${SMTP_USER:-}
      Mail__SmtpPassword: ${SMTP_PASSWORD:-}
      Mail__FromAddress: ${MAIL_FROM:-no-reply@example.com}
      Notifications__SecurityEmails__0: ${SECURITY_DESK_EMAIL:-}
      Training__DurationSeconds: ${TRAINING_DURATION_SECONDS:-180}
      Theme__OrganizationName: ${ORGANIZATION_NAME:-VisitFlow}
    volumes:
      - app-data:/app/App_Data
      - ./media:/app/wwwroot/media:ro
    networks: [backend]

  proxy:
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports:
      - "80:80"
      - "443:443"
    environment:
      VISITFLOW_DOMAIN: ${VISITFLOW_DOMAIN:-localhost}
    volumes:
      - ./deploy/caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    networks: [backend]

  # Geliştirme e-posta yakalayıcısı: http://localhost:8025 (docker compose --profile dev up -d).
  # Üretimde kullanmayın; .env içinde gerçek SMTP sunucunuzu tanımlayın.
  mailpit:
    image: axllent/mailpit:latest
    profiles: [dev]
    ports:
      - "127.0.0.1:8025:8025"
    networks: [backend]

networks:
  backend:
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  db-data:
  app-data:
  caddy-data:
